apiVersion: v1
kind: Pod
metadata:
  name: vmcalc-auth-backend
  namespace: backend
  labels:
    app: vmcalc-auth
    type: backend
spec:
  containers:
    - name: vmcalc-auth
      image: shirmaymon/devops-auth:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5001
      env:
        - name: DB_HOST
          value: vmcalc-db-service.database
        - name: DB_NAME
          value: vmcalc
        - name: DB_USER
          value: vmcalc
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: COOKIE_SECURE
          value: "false"
        - name: SESSION_IDLE_MINUTES
          value: "30"
        - name: SESSION_ABSOLUTE_HOURS
          value: "8"
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
