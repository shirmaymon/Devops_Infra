apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmcalc-backend-ingress
  namespace: backend
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: vmcalc-auth-service
                port:
                  number: 5001
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vmcalc-flask-service
                port:
                  number: 5000