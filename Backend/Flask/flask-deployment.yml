apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmcalc-flask-deployment
  namespace: backend
  labels:
    app: vmcalc-flask-deployment
    type: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmcalc-flask-pod
      type: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vmcalc-flask-pod
        type: backend
    spec:
      containers:
        - name: vmcalc-flask
          image: shirmaymon/devops-backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: vmcalc-volume
              mountPath: /web-data
      volumes:
        - name: vmcalc-volume
          persistentVolumeClaim:
            claimName: vmcalc-pvc