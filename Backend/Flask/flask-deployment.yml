apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmcalc-flask-deployment
  namespace: backend
  labels:
    app: vmcalc-flask-deployment
    type: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vmcalc-flask-pod
      type: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vmcalc-flask-pod
        type: backend
    spec:
      containers:
        - name: vmcalc-flask
          image: shirmaymon/devops-backend:c0c60a5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: vmcalc-db-service.database
            - name: DB_NAME
              value: vmcalc
            - name: DB_USER
              value: vmcalc
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi