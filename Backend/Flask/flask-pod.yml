apiVersion: v1
kind: Pod
metadata:
  name: vmcalc-flask-backend
  namespace: backend
  labels:
    app: vmcalc-flask
    type: backend
spec:
  containers:
    - name: vmcalc-flask
      image: shirmaymon/devops-backend:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
      volumeMounts:
        - name: vmcalc-volume
          mountPath: /web-data
  volumes:
    - name: vmcalc-volume
      persistentVolumeClaim:
        claimName: vmcalc-pvc