apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmcalc-auth-deployment
  namespace: backend
  labels:
    app: vmcalc-auth-deployment
    type: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmcalc-auth-pod
      type: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: vmcalc-auth-pod
        type: backend
    spec:
      containers:
        - name: vmcalc-auth
          image: shirmaymon/devops-auth:2d70718
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: DB_HOST
              value: vmcalc-db-service.database
            - name: DB_NAME
              value: vmcalc
            - name: DB_USER
              value: vmcalc
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: COOKIE_SECURE
              value: "false"
            - name: SESSION_IDLE_MINUTES
              value: "30"
            - name: SESSION_ABSOLUTE_HOURS
              value: "8"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi