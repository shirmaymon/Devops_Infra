apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vmcalc-frontend-ingress
  namespace: frontend
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vmcalc-apache-service
                port:
                  number: 80