apiVersion: v1
kind: Pod
metadata:
  name: vmcalc
  labels:
    app: vmcalc
spec:
  nodeSelector:
    role: front
  containers:
    - name: vmcalc
      image: shirmaymon/devopsweb:v1
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi