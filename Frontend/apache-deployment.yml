apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmcalc-apache-deployment
  namespace: frontend
  labels:
    app: vmcalc-apache-deployment
    type: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmcalc-apache-pod
      type: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  revisionHistoryLimit: 1
  template:
    metadata:
      labels:
        app: vmcalc-apache-pod
        type: frontend
    spec:
      containers:
        - name: vmcalc-apache
          image: shirmaymon/devops-front:93f6176
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
