apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmcalc-deployment
  labels:
    app: vmcalc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmcalc
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vmcalc
    spec:
      nodeSelector:
        role: front
      containers:
        - name: vmcalc
          image: shirmaymon/devopsweb:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10