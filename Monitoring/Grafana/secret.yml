# TEMPLATE: the admin login of Grafana (read by the kube-prometheus-stack chart, see Monitoring/Prometheus/kube-prometheus-stack-values.yml).
# Replace CHANGE_ME with the password you want, then apply it BEFORE installing the chart.
# Do NOT commit the real password to git.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: CHANGE_ME
